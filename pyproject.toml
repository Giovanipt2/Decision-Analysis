[project]
name = "decision-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giovani Mambrim Leme", email = "giovanimambrimleme.@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
decision-analysis = "decision_analysis:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
